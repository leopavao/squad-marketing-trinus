squad:
  nome: mkt-trinus
  # MISSÃO: o teto dos três níveis de objetivo.
  #   1. missão (aqui)         estável, muda quase nunca
  #   2. objetivo do ciclo     marca/contrato-operacao.md, com data de validade
  #   3. trabalho da peça      deduzido por peça, ver playbooks/_shared/as-perguntas.md
  # Formulação candidata, derivada de marca/contexto.md. PENDENTE de validação com o cliente.
  missao: fazer a Trinus ser reconhecida como o lugar onde a decisão patrimonial começa pelo objetivo, por um público que decide com números
  entrega: editoria, carrossel, reels e stories de Instagram, para a Trinus aprovar e publicar
  escopo: marca-unica
  marca: Trinus
  cliente: marca  # contexto oficial e único da Trinus; a raiz do repo é a própria marca
  fase: editoria  # foco atual: presença digital / conteúdo orgânico. Campanha de mídia ainda NÃO ativa.

  # ENTRADAS AGNÓSTICAS
  # Claude Code: CLAUDE.md · Codex/ChatGPT: AGENTS.md · Gemini: GEMINI.md
  # Todos os adaptadores apontam para esta mesma configuração e não duplicam conhecimento.
  entrada_canonica: README.md
  politica_ativos: core/politica-ativos.md

  # REGRA DE OURO (playbooks/_shared/principios-criativos.md):
  # Se uma instrução pode ser seguida sem pensar, virou receita — é parâmetro, não passo a passo.
  # Sem tabelas-catálogo: o agente DEDUZ o formato pelas perguntas, não consulta uma lista.
  # Exceção: quando o humano crava algo (dado/gancho/imagem), o agente obedece ao pé da letra.

  pensamento:
    - playbooks/_shared/principios-criativos.md
    - playbooks/_shared/as-perguntas.md
    - playbooks/_shared/briefing-conversacional.md
    - playbooks/_shared/direcao-criativa.md
    - playbooks/_shared/direcao-imagens.md
    - playbooks/_shared/criativo-anatomia.md
    - playbooks/_shared/editoria.md
    - playbooks/_shared/premissas-da-marca.md
    - marca/playbook-memoria-criativa.md

  carrega_sempre:
    - memory/lessons-gerais.md
    - core/diretrizes-linguagem.md
    - core/politica-ativos.md
    - marca/memory/memoria-criativa.md
    - marca/memory/decisoes-criativas.md
    - marca/memory/casos-de-falha.md
    - marca/design-system/gramatica-carrossel.md
    - marca/contrato-operacao.md  # objetivo vigente e cadência; se vencido, o agente PARA e pergunta

  # Quem opera de fato. Papel declarado sem operação vira sensação de cobertura.
  agentes:
    - id: orquestrador
    - id: editor-conteudo
    - id: diretor-criativo
    - id: copywriter
    - id: designer

  agentes_bloqueados:
    - id: trend-hunter
      motivo: sem token do Apify; ver marca/watchlist.md
      efeito: a camada 1 não roda, e a pauta entra pela conversa em vez do radar
      reativar_quando: o token existir e estiver em variável de ambiente

  agentes_dormentes:
    - id: estrategista
    - id: analista-dados

  entrada_demanda:
    - {passo: briefing, agentes: [orquestrador, editor-conteudo, diretor-criativo], condicional: true, checkpoint: true}

  fundacao_editoria:
    - {passo: pilares, agentes: [editor-conteudo, diretor-criativo], checkpoint: true}

  camada1_inteligencia:
    - {passo: radar, agente: trend-hunter, checkpoint: true}

  camada2_definicao:
    - {passo: calendario, agente: editor-conteudo, checkpoint: true}

  # REGRA DE ARTEFATO (criada em 2026-08-10, ver marca/memory/casos-de-falha.md)
  # Todo passo com `artefato` só é considerado cumprido quando o arquivo existe.
  # Checkpoint sem arquivo é autodeclaração, e autodeclaração já entregou peça reprovada.
  # Se o artefato não existir, o passo seguinte não começa.

  camada3_execucao:
    - {passo: consultar-memoria-criativa, agentes: [diretor-criativo, designer], checkpoint: true, artefato: "marca/output/{peca}/leitura-de-referencia.md"}
    - {passo: concepting, agente: diretor-criativo, checkpoint: true, artefato: "marca/output/{peca}/conceito.md"}
    - {passo: brief-criativo, agente: diretor-criativo, artefato: "marca/output/{peca}/brief-criativo.md"}
    - {passo: producao, agentes: [copywriter, designer]}
    - {passo: comparar-referencias-aprovadas, agente: diretor-criativo, checkpoint: true, artefato: "marca/output/{peca}/comparacao.md"}
    - {passo: revisao, agente: diretor-criativo}
    - {passo: montar-kit, agente: orquestrador, checkpoint: true}
    - {passo: registrar-governanca, agente: orquestrador, condicional: aprovado}

  # REGRA DAS TRÊS CAMADAS (2026-08-10, ver marca/memory/memoria-criativa.md)
  # Invariante: tokens, grade, escala de canvas, logo, dourado, universo
  #   fotográfico, locação única por carrossel. Não muda sem o humano.
  # Biblioteca: marca/referencias/ cresce a cada aprovação, é repertório.
  # Livre: tese, copy, dado, narrativa, enquadramento. Criatividade solta aqui.
  # Se a peça parecer pedir algo da camada invariante, o agente PARA e pergunta.

  artefatos:
    leitura-de-referencia:
      secoes_obrigatorias: ["## Arquivos abertos", "## Alternância", "## Parâmetros medidos", "## Locação fotográfica"]
      conteudo:
        - arquivos de referência efetivamente abertos, com caminho ou link, um por linha
        - se algum não abriu, dizer qual e por quê
        - mapa de alternância clara e navy, tela a tela
        - cinco parâmetros medidos no modelo mestre, conforme gramatica-carrossel.md
        - locação fotográfica única escolhida para o conjunto
    comparacao:
      secoes_obrigatorias: ["## Comparação", "## Checklist", "## Desvios", "## Veredito"]
      conteudo:
        - tabela peça nova contra o modelo mestre, um critério por linha
        - "critérios: direção fotográfica, tipografia, densidade, narrativa, acabamento"
        - resultado do checklist de reprovação automática, item a item
        - "desvios de gramática: listar, ou escrever 'nenhum'. Desvio não autorizado bloqueia a entrega."
        - "veredito: entregar, perguntar ao humano, ou voltar para produção"

  # CAMADA 4 — Distribuição: postagem automática. NÃO CONSTRUIR AGORA.
  # A governança editorial e o arquivo de publicações vivem no Google Drive.
  # Publicação automática permanece desativada.

  pipeline_dormente:
    - {passo: diagnostico, agente: analista-dados, checkpoint: true}
    - {passo: plano, agente: estrategista}
    - {passo: consultar-memoria-criativa, agentes: [diretor-criativo, designer], checkpoint: true, artefato: "marca/output/{peca}/leitura-de-referencia.md"}
    - {passo: concepting, agente: diretor-criativo, checkpoint: true, artefato: "marca/output/{peca}/conceito.md"}
    - {passo: brief-criativo, agente: diretor-criativo, artefato: "marca/output/{peca}/brief-criativo.md"}
    - {passo: producao, agentes: [copywriter, designer]}
    - {passo: comparar-referencias-aprovadas, agente: diretor-criativo, checkpoint: true, artefato: "marca/output/{peca}/comparacao.md"}
    - {passo: revisao, agente: diretor-criativo}
    - {passo: montar-kit, agente: orquestrador, checkpoint: true}
    - {passo: lessons-learned, agente: analista-dados, checkpoint: true}
