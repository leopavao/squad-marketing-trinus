name: Invariantes do squad

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Regras estruturais do squad
        run: python3 scripts/checar_invariantes.py
